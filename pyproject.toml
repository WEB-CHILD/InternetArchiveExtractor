[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-archive-extractor"           
version = "1.0.1"
description = "Tool for extracting archived web sites from the Internet Archive saving as WARC files."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Victor Harbo Johnston", email = "vijo@cas.au.dk" }, { name = "Jørn Thøgersen", email = "jorn@cas.au.dk"}]
requires-python = ">=3.8"
dependencies = [
    "certifi",
    "charset-normalizer",
    "idna",
    "numpy",
    "pandas",
    "pysqlite3",
    "python-dateutil",
    "python-magic",
    "pytz",
    "pywaybackup",
    "requests",
    "selectolax",
    "six",
    "tqdm",
    "tzdata",
    "urllib3",
    "warcio"
]


[project.scripts]
internet-archive-extractor = "main:main"

[project.urls]
Homepage = "https://github.com/WEB-CHILD/InternetArchiveExtractor"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
